{% extends "layouts/app.html" %}

{% block title %}{{ site_title }} — Recordings{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-[var(--text-primary)]">Recordings</h1>
            <p class="text-sm text-[var(--text-muted)] mt-1">Session recordings and audit playback</p>
        </div>
        <div class="flex items-center gap-3">
            <input type="search" id="recordings-search" placeholder="Search recordings..."
                class="form-input w-64" aria-label="Search recordings">
        </div>
    </div>

    <div id="recordings-error" class="hidden alert alert-error" role="alert" aria-live="polite"></div>

    <div id="recordings-empty" class="hidden text-center py-16">
        <svg class="mx-auto h-12 w-12 text-[var(--text-muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <h3 class="mt-3 text-lg font-medium text-[var(--text-muted)]">No recordings</h3>
        <p class="mt-1 text-sm text-[var(--text-muted)]">No session recordings found.</p>
    </div>

    <div id="recordings-content" class="hidden">
        <div class="card table-wrapper">
            <table class="w-full">
                <thead>
                    <tr class="border-b border-[var(--border)] text-left text-xs text-[var(--text-muted)] uppercase tracking-wider">
                        <th>Name</th>
                        <th>Protocol</th>
                        <th>User</th>
                        <th>Duration</th>
                        <th>Date</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="recordings-list" class="divide-y divide-[var(--border)]"></tbody>
            </table>
        </div>
    </div>

    <!-- Player modal -->
    <div id="player-section" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-6" role="dialog" aria-modal="true" aria-labelledby="player-title" aria-hidden="true">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-xl w-full max-w-7xl max-h-[90vh] flex flex-col">
            <div id="player-header" class="flex items-center justify-between px-4 py-3 border-b border-[var(--border)]">
                <span id="player-title" class="text-sm font-medium text-[var(--text-secondary)]">Playback</span>
                <button id="player-close" class="btn btn-sm text-[var(--text-muted)] hover:text-[var(--text-primary)] p-1" aria-label="Close player">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="player-display" class="flex-1 bg-black m-2 rounded overflow-auto" style="min-height:400px"></div>
            <div id="player-controls" class="flex items-center gap-3 px-4 py-3 border-t border-[var(--border)]">
                <button id="play-btn" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-[var(--text-primary)] rounded text-sm font-medium transition-colors">Play</button>
                <button id="fullscreen-btn" class="p-1.5 text-[var(--text-muted)] hover:text-[var(--text-primary)] rounded transition-colors" title="Toggle fullscreen" aria-label="Toggle fullscreen">
                    <svg id="fs-icon-enter" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    <svg id="fs-icon-exit" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
                </button>
                <input type="range" id="seek-slider" min="0" max="1000" value="0" class="flex-1" style="accent-color:#10b981" aria-label="Playback position">
                <span id="player-time" class="text-xs text-[var(--text-muted)]">0:00 / 0:00</span>
            </div>
        </div>
    </div>
</div>

<style>
    .player-fullscreen { position: fixed; inset: 0; z-index: 9999; background: #000; padding: 0; }
    .player-fullscreen #player-header { display: none; }
    .player-fullscreen > div { width: 100%; height: 100%; max-width: none; max-height: none; border: none; border-radius: 0; }
    .player-fullscreen #player-display { margin: 0; border-radius: 0; min-height: 0; flex: 1; }
    .player-fullscreen #player-controls { position: absolute; bottom: 0; left: 0; right: 0; }
</style>

<!-- Guacamole JS modules (playback) -->
<script src="/guac/Namespace.js"></script>
<script src="/guac/Client.js"></script>
<script src="/guac/Display.js"></script>
<script src="/guac/Event.js"></script>
<script src="/guac/InputSink.js"></script>
<script src="/guac/IntegerPool.js"></script>
<script src="/guac/Keyboard.js"></script>
<script src="/guac/KeyEventInterpreter.js"></script>
<script src="/guac/Layer.js"></script>
<script src="/guac/Mouse.js"></script>
<script src="/guac/Parser.js"></script>
<script src="/guac/Position.js"></script>
<script src="/guac/Status.js"></script>
<script src="/guac/Touch.js"></script>
<script src="/guac/Tunnel.js"></script>
<script src="/guac/UTF8Parser.js"></script>
<script src="/guac/InputStream.js"></script>
<script src="/guac/OutputStream.js"></script>
<script src="/guac/StringReader.js"></script>
<script src="/guac/StringWriter.js"></script>
<script src="/guac/ArrayBufferReader.js"></script>
<script src="/guac/ArrayBufferWriter.js"></script>
<script src="/guac/BlobReader.js"></script>
<script src="/guac/BlobWriter.js"></script>
<script src="/guac/DataURIReader.js"></script>
<script src="/guac/AudioContextFactory.js"></script>
<script src="/guac/AudioPlayer.js"></script>
<script src="/guac/AudioRecorder.js"></script>
<script src="/guac/VideoPlayer.js"></script>
<script src="/guac/JSONReader.js"></script>
<script src="/guac/Object.js"></script>
<script src="/guac/RawAudioFormat.js"></script>
<script src="/guac/SessionRecording.js"></script>

<script nonce="{{ csp_nonce }}">
(function() {
    var searchInput = document.getElementById('recordings-search');
    var searchTimer = null;
    var errBox = document.getElementById('recordings-error');

    function listFail(msg) {
        errBox.textContent = msg;
        errBox.classList.remove('hidden');
    }
    function clearListError() { errBox.classList.add('hidden'); }

    // Event delegation for play/delete buttons — registered once; the list
    // body is re-rendered on every refresh, so a listener inside the fetch
    // chain would stack one per load.
    document.getElementById('recordings-list').addEventListener('click', function(ev) {
        var btn = ev.target.closest('.rec-play, .rec-delete');
        if (!btn) return;
        var file = btn.getAttribute('data-file');
        var title = btn.getAttribute('data-title');
        if (btn.classList.contains('rec-play')) playRecording(file, title);
        else if (btn.classList.contains('rec-delete')) deleteRecording(file, title);
    });

    // Human-readable recording name: `YYYY-MM-DD HH:MM — <entry> — <user>`
    // (server local time from created_at, pre-formatted by the API as
    // `display_date`; entry falls back to hostname then session_id; user
    // falls back to 'unknown').
    function recordingDisplayName(rec) {
        function pad(n) { return String(n).padStart(2, '0'); }
        var dateStr = '';
        if (rec.display_date) {
            dateStr = rec.display_date;
        } else {
            var dateIso = rec.created_at || rec.modified;
            if (dateIso) {
                var d = new Date(dateIso);
                if (!isNaN(d.getTime())) {
                    dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                }
            }
        }
        var file = rec.name || rec.filename || '';
        var entry = rec.entry_display_name || rec.hostname || file.replace(/\.guac(\.enc)?$/, '') || 'unknown';
        var user = rec.user || rec.created_by || 'unknown';
        return (dateStr ? dateStr + ' — ' : '') + entry + ' — ' + user;
    }

    function loadRecordings(query) {
        var url = '/api/recordings';
        if (query) url += '?q=' + encodeURIComponent(query);
        fetch(url, { credentials: 'same-origin' })
            .then(function(r) {
                if (r.status === 401) { window.location.href = '/'; return null; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) {
                var list = document.getElementById('recordings-list');
                var empty = document.getElementById('recordings-empty');
                var content = document.getElementById('recordings-content');
                if (data === null) return; // 401 redirect above
                clearListError();
                var items = Array.isArray(data) ? data : (data.recordings || []);
                if (items.length === 0) {
                    empty.classList.remove('hidden');
                    content.classList.add('hidden');
                    return;
                }
                empty.classList.add('hidden');
                content.classList.remove('hidden');
                function formatDuration(secs) {
                    var s = Math.floor(secs);
                    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
                    if (h > 0) return h + 'h ' + m + 'm';
                    if (m > 0) return m + 'm ' + sec + 's';
                    return sec + 's';
                }
                list.innerHTML = items.map(function(rec) {
                    var displayName = recordingDisplayName(rec);
                    var protocol = (rec.session_type || rec.protocol || '').toUpperCase();
                    var user = rec.user || rec.created_by || '—';
                    var duration = rec.duration_secs != null ? formatDuration(rec.duration_secs) : '—';
                    var date = (rec.modified || rec.created_at || '').replace('T', ' ').slice(0, 19) || '—';
                    var protoColors = {
                        SSH: 'proto-ssh',
                        RDP: 'proto-rdp',
                        VNC: 'proto-vnc',
                        SPICE: 'proto-spice',
                        WEB: 'proto-web',
                        VMWARE: 'proto-vmware',
                        PROXMOX: 'proto-proxmox',
                        VDI: 'proto-vdi',
                    };
                    var colorClass = protoColors[protocol] || 'bg-[var(--bg-card)] text-[var(--text-muted)] border-[var(--border)]';
                    return '<tr class="hover:bg-[var(--bg-hover)]/50 transition-colors">' +
                        '<td class="px-4 py-3 text-sm text-[var(--text-primary)]">' + escapeHtml(displayName) + '</td>' +
                        '<td class="px-4 py-3"><span class="px-2 py-0.5 text-xs font-medium rounded border ' + colorClass + '">' + escapeHtml(protocol) + '</span></td>' +
                        '<td class="px-4 py-3 text-sm text-[var(--text-muted)]">' + escapeHtml(user) + '</td>' +
                        '<td class="px-4 py-3 text-sm text-[var(--text-muted)]">' + escapeHtml(String(duration)) + '</td>' +
                        '<td class="px-4 py-3 text-sm text-[var(--text-muted)]">' + escapeHtml(String(date)) + '</td>' +
                        '<td class="px-4 py-3 text-right">' +
                            '<button class="rec-play text-emerald-400 hover:text-emerald-300 text-sm mr-3" data-file="' + escapeAttr(rec.name || rec.filename || '') + '" data-title="' + escapeAttr(displayName) + '">Play</button>' +
                            '<button class="rec-delete text-red-400 hover:text-red-300 text-sm" data-file="' + escapeAttr(rec.name || rec.filename || '') + '" data-title="' + escapeAttr(displayName) + '">Delete</button>' +
                        '</td>' +
                        '</tr>';
                }).join('');
            })
            .catch(function(e) {
                listFail('Could not load recordings \u2014 ' + (e && e.message ? e.message : 'network error') + '.');
            });
    }

    // ── Player (Guacamole SessionRecording over StaticHTTPTunnel) ─────
    var currentRecording = null;
    var playerDisplayEl = document.getElementById('player-display');
    var playBtn = document.getElementById('play-btn');
    var seekSlider = document.getElementById('seek-slider');
    var timeEl = document.getElementById('player-time');

    // Scale the recording to fill the available area. Fullscreen uses the
    // whole viewport (no 1.0 cap, mirroring client.html); the modal keeps
    // the video at modal size (never upscaled past natural resolution).
    function scaleRecordingDisplay() {
        if (!currentRecording) return;
        var display = currentRecording.getDisplay();
        var w = display.getWidth();
        var h = display.getHeight();
        if (w <= 0 || h <= 0) return;
        var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        var scale;
        if (inFs) {
            scale = Math.min(window.innerWidth / w, window.innerHeight / h);
        } else {
            var containerWidth = playerDisplayEl.clientWidth || 1080;
            var containerHeight = playerDisplayEl.clientHeight || 600;
            scale = Math.min(containerWidth / w, containerHeight / h, 1);
        }
        display.scale(scale);
    }

    function formatTime(millis) {
        var s = Math.max(0, Math.floor((millis || 0) / 1000));
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        var mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
        return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
    }

    var lastFocused = null;
    function closePlayer() {
        playerSection.setAttribute('aria-hidden', 'true');
        if (lastFocused && typeof lastFocused.focus === 'function') {
            try { lastFocused.focus(); } catch (e) { /* detached */ }
        }
        lastFocused = null;
        if (currentRecording) {
            try { currentRecording.pause(); } catch (e) {}
            currentRecording = null;
        }
        // Exit browser fullscreen if active
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            var exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) try { exit.call(document); } catch (e) {}
        }
        playerDisplayEl.innerHTML = '';
        document.getElementById('player-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('player-fullscreen');
        fsEnterIcon.classList.remove('hidden');
        fsExitIcon.classList.add('hidden');
        playBtn.textContent = 'Play';
        seekSlider.value = 0;
        timeEl.textContent = '0:00 / 0:00';
    }

    // ── Fullscreen toggle ──
    var fsEnterIcon = document.getElementById('fs-icon-enter');
    var fsExitIcon = document.getElementById('fs-icon-exit');
    var playerSection = document.getElementById('player-section');

    function updateFullscreenUI() {
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        var inFs = !!fsEl;
        fsEnterIcon.classList.toggle('hidden', inFs);
        fsExitIcon.classList.toggle('hidden', !inFs);
        playerSection.classList.toggle('player-fullscreen', inFs);
        // Inline style wins over the stylesheet, so adjust it explicitly.
        playerDisplayEl.style.minHeight = inFs ? '0' : '400px';
        scaleRecordingDisplay();
    }

    document.getElementById('fullscreen-btn').addEventListener('click', function() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            var exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document);
        } else {
            // Fullscreen the whole player section so the controls overlay
            // the bottom of the viewport and the CSS below applies.
            var req = playerSection.requestFullscreen || playerSection.webkitRequestFullscreen;
            if (req) req.call(playerSection);
        }
    });

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
    window.addEventListener('resize', scaleRecordingDisplay);

    // Dialog a11y: Escape closes the player overlay when it is visible.
    // Per-page handling (static/js/modal.js is unused; see the note there).
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !playerSection.classList.contains('hidden')) closePlayer();
    });

    window.playRecording = function(name, title) {
        closePlayer();
        lastFocused = document.activeElement;

        document.getElementById('player-title').textContent = 'Playback: ' + (title || name);
        var section = document.getElementById('player-section');
        section.classList.remove('hidden');
        section.setAttribute('aria-hidden', 'false');
        document.getElementById('player-close').focus();

        var tunnel = new Guacamole.StaticHTTPTunnel(
            '/api/recordings/' + encodeURIComponent(name),
            false,
            apiHeaders()
        );
        var recording = new Guacamole.SessionRecording(tunnel);
        currentRecording = recording;

        var display = recording.getDisplay();
        playerDisplayEl.appendChild(display.getElement());
        display.onresize = scaleRecordingDisplay;

        var duration = 0;
        var currentPos = 0;
        var seeking = false;

        recording.onprogress = function(millis) {
            duration = millis;
            timeEl.textContent = formatTime(currentPos) + ' / ' + formatTime(duration);
        };

        recording.onplay = function() { playBtn.textContent = 'Pause'; };
        recording.onpause = function() { playBtn.textContent = 'Play'; };
        recording.onseek = function(position) {
            currentPos = position;
            if (!seeking && duration > 0) seekSlider.value = Math.round((position / duration) * 1000);
            timeEl.textContent = formatTime(position) + ' / ' + formatTime(duration);
        };

        playBtn.onclick = function() {
            if (recording.isPlaying()) recording.pause();
            else recording.play();
        };

        seekSlider.addEventListener('mousedown', function() { seeking = true; });
        seekSlider.addEventListener('mouseup', function() { seeking = false; });
        seekSlider.addEventListener('input', function() {
            if (duration > 0) recording.seek((seekSlider.value / 1000) * duration);
        });

        recording.connect();
    };

    window.deleteRecording = function(file, title) {
        if (!confirm('Delete recording "' + (title || file) + '"?')) return;
        fetch('/api/recordings/' + encodeURIComponent(file), {
            method: 'DELETE',
            credentials: 'same-origin'
        }).then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            clearListError();
            loadRecordings();
        }).catch(function(e) {
            listFail('Failed to delete recording \u2014 ' + (e && e.message ? e.message : 'network error') + '.');
        });
    };

    document.getElementById('player-close').addEventListener('click', closePlayer);

    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() { loadRecordings(searchInput.value); }, 300);
    });

    loadRecordings();
})();
</script>
{% endblock %}
